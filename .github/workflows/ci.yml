name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Toolchain drift is invisible to a push-only trigger: the `ui` snapshots and the floating-stable
  # clippy job both depend on whatever rustc ships next, so without a timer a break only surfaces on
  # whichever unlucky PR comes after the release.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full workspace suite: unit tests, integration tests, and doctests.
      #
      # The snapshot half of the trybuild suite is `#[ignore]`d (see tests/trybuild.rs) so it is
      # skipped here without a name filter and runs in the `ui` job below instead. The old spelling
      # was `-- --skip ui`, which is a SUBSTRING match: it happened to catch only `fn ui`, but any
      # later test whose name contained "ui" would have been silently dropped from the required job.
      # `tests/ui/pass/*` still runs here, because a must-compile case has no snapshot and therefore
      # cannot drift — a failure there is always a real regression.
      - name: cargo test
        run: cargo test --workspace

  # The `.stderr` snapshots are compared against rustc's exact diagnostics, so they are version
  # sensitive and must run on a PINNED toolchain — on a floating `stable` a new release silently
  # invalidates them. This job is REQUIRED. It used to be a `continue-on-error: true` step, which
  # meant every diagnostic the crate pins — the `async fn` rejection, the RPITIT and trait-object
  # rejections, `recurse_level = 0`, the growth checks, ~40 others — could regress with CI green.
  # (When this was audited on 2026-08-15 the snapshots were in fact broken: 25 of 39 cases
  # mismatched on a then-current stable, and nobody had noticed.)
  #
  # To re-bless after an intentional diagnostic change, use the SAME toolchain:
  #   TRYBUILD=overwrite cargo +1.96.0 test --test trybuild -- --ignored
  # Bumping the pin is a deliberate act: change it here and re-bless in the same commit.
  ui:
    name: ui snapshots (pinned 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test trybuild -- --ignored

  msrv:
    name: build (1.71.0 MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.71.0
      - uses: Swatinem/rust-cache@v2
      # Resolve with a MODERN cargo, then build with the old one.
      #
      # cargo 1.71 predates MSRV-aware resolution, so left to itself it takes the newest
      # semver-compatible version of everything. Today `syn`/`quote`/`proc-macro2` all still declare
      # 1.71, but the day any of them bumps to 1.72 this job turns red for a reason that has nothing
      # to do with this crate's floor. A current cargo asked to prefer MSRV-compatible versions picks
      # a set 1.71 can actually build, and `--locked` then holds the old cargo to that choice.
      - name: resolve dependencies with an MSRV-aware cargo
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile
      # The declared MSRV covers *building the published library*, not the test suite: the
      # dev-dependency `trybuild` needs a newer rustc, so `cargo test` cannot run on this floor.
      #
      # 1.71 is measured, and it is only reachable because `safegraph` is taken with
      # `default-features = false`. Its default `matrix` feature pulls `sprs`, which declares
      # rustc 1.88 and dragged the whole crate's floor up with it; nothing here needs the matrix
      # backend. `type-leak` already depends on `safegraph` with default features off, so that
      # second path never contributed. Cargo.lock is gitignored, so the step above resolves fresh.
      - name: cargo build (decycle + macro + impl)
        run: cargo +1.71.0 build -p decycle -p decycle-macro -p decycle-impl --locked

  clippy:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: doc (stable)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  # Miri catches what the ordinary suite cannot: the crate's generated code transmutes fn
  # pointers (ranked floor) and type-puns values (structural casts), and three separate UB
  # classes once coexisted with a fully green `cargo test`. Without this job they can silently
  # come back.
  #
  # The target list is curated for runtime, not arbitrary. Miri is ~100x slower, so the whole
  # suite is not viable: `unbounded_reentry` exceeds 10 minutes even skipping its 20_000-frame
  # test, `span_tying_reentry` takes ~9 minutes and `structural` ~5. Those are excluded because
  # `ub_regressions` already covers the same two mechanisms — a ranked floor crossing and a
  # structural `&dyn Fn(&Self)` cast — in about 30 seconds. If you add a test that exercises
  # `unsafe` in a NEW way, add its target here.
  miri:
    name: miri (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `ub_regressions` pins the three classes from the 2026-08-04 audit; two of them are
      # invisible to a native run and only fail here.
      - run: cargo miri test --test ub_regressions
      - run: cargo miri test --test structural_soundness_regressions
      - run: cargo miri test --test structural_sig
      - run: cargo miri test --test reentry_bridge
      - run: cargo miri test --test bareparam_reentry
      # Added 2026-08-15. Both post-date the original list and exercise `unsafe` shapes none of the
      # targets above reach, which is exactly the rule this job's comment states:
      #   * maybe_sized_method_generic — the only target where the re-entry fn pointer carries WIDE
      #     (fat) pointer arguments across the floor transmute: `?Sized` method generics
      #     instantiated at `[u8]` and at `dyn Stream<Atom = u8>`. Measured 56 s; its recursion
      #     depth drops to 60 under `cfg(miri)` (see DEPTH in that file), since the shape is what
      #     matters here, not the depth.
      #   * structural_body_trait_where — structural casts on GENERIC trait impls whose argument
      #     and return types are associated-type projections over Box-bearing self types. 0.3 s.
      - run: cargo miri test --test maybe_sized_method_generic
      - run: cargo miri test --test structural_body_trait_where

  # The `no_std` claim is only worth making if it is checked: the facade must build for a target
  # with no std at all, with default features off. `x86_64-unknown-none` is a core-only target, so
  # anything that reaches for `std` — or drags `decycle-impl` into the target graph — fails here.
  no_std:
    name: build (no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p decycle --no-default-features --target x86_64-unknown-none
      # Feature combinations must each stand on their own, not only in the default union.
      - run: cargo build -p decycle --no-default-features
      - run: cargo build -p decycle --no-default-features --features std
      - run: cargo build -p decycle --no-default-features --features api
      # The steps above build only the FACADE, which contains no expansions — so on their own they
      # say nothing about the code the macro emits. This fixture actually runs `#[decycle]` with
      # default features off, covering the two combinations documented as supported without `std`
      # (structural, and ranked with `support_infinite_cycle = false`). It is outside the workspace
      # on purpose; see the root manifest.
      - name: build a real no_std consumer (expands the macro)
        run: cargo build --manifest-path tests/nostd_consumer/Cargo.toml --target x86_64-unknown-none
      - name: build the same consumer for the host
        run: cargo build --manifest-path tests/nostd_consumer/Cargo.toml
