name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full workspace suite: unit tests, integration tests, and doctests.
      # `--skip ui` excludes the trybuild snapshot test (`fn ui` in tests/trybuild.rs
      # is the only `#[test]` named `ui` in the workspace) so channel-sensitive
      # .stderr drift can never fail this required step; trybuild runs separately below.
      - name: cargo test (skip trybuild snapshots)
        run: cargo test --workspace -- --skip ui
      # The trybuild UI .stderr snapshots are blessed on stable rustc and are
      # channel/version-sensitive. A future rustc release can legitimately drift them,
      # which is expected occasionally, so this step is allowed to fail without failing
      # the job. To re-bless the snapshots: TRYBUILD=overwrite cargo test --test trybuild
      - name: cargo test --test trybuild (UI snapshots, may drift)
        run: cargo test --test trybuild
        continue-on-error: true

  msrv:
    name: build (1.71.0 MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.71.0
      - uses: Swatinem/rust-cache@v2
      # The declared MSRV (rust-version = 1.71) covers *building the published library*, not
      # the test suite: the dev-dependency `trybuild` requires rustc 1.76+, so `cargo test`
      # cannot run on the 1.71 floor. Cargo.lock is gitignored, so this resolves fresh with
      # 1.71's cargo — the 1.71 floor is set by the latest release of the core proc-macro deps
      # (syn 2.0, quote, unicode-ident all declare rust-version 1.71). If one of those bumps
      # its own MSRV above 1.71 in a future release, this job will flag it and the floor here
      # (and in the three `rust-version` fields) must move with it. `type-leak` 0.7 (safegraph,
      # MSRV 1.56) is a non-optional dependency and sits below this floor.
      - name: cargo build (decycle + macro + impl)
        run: cargo build -p decycle -p decycle-macro -p decycle-impl

  clippy:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: doc (stable)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  # Miri catches what the ordinary suite cannot: the crate's generated code transmutes fn
  # pointers (ranked floor) and type-puns values (structural casts), and three separate UB
  # classes once coexisted with a fully green `cargo test`. Without this job they can silently
  # come back.
  #
  # The target list is curated for runtime, not arbitrary. Miri is ~100x slower, so the whole
  # suite is not viable: `unbounded_reentry` exceeds 10 minutes even skipping its 20_000-frame
  # test, `span_tying_reentry` takes ~9 minutes and `structural` ~5. Those are excluded because
  # `ub_regressions` already covers the same two mechanisms — a ranked floor crossing and a
  # structural `&dyn Fn(&Self)` cast — in about 30 seconds. If you add a test that exercises
  # `unsafe` in a NEW way, add its target here.
  miri:
    name: miri (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `ub_regressions` pins the three classes from the 2026-08-04 audit; two of them are
      # invisible to a native run and only fail here.
      - run: cargo miri test --test ub_regressions
      - run: cargo miri test --test structural_soundness_regressions
      - run: cargo miri test --test structural_sig
      - run: cargo miri test --test reentry_bridge
      - run: cargo miri test --test bareparam_reentry
