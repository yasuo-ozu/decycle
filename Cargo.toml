[package]
name = "decycle"
version = "0.5.0"
edition = "2021"
rust-version = "1.71"
description = "Solve circular trait obligation"
license = "MIT"
repository = "https://github.com/yasuo-ozu/decycle"
keywords = ["macro", "trait", "recursive", "circular", "obligation"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["yasuo-ozu"]
exclude = ["docs/"]

[lib]
path = "lib.rs"

[dependencies]
decycle-macro = { path = "macro", version = "0.5.0" }
decycle-impl = { path = "decycle-impl", version = "0.5.0" }

[dev-dependencies]
traitdef = { path = "tests/traitdef" }
typedef = { path = "tests/typedef" }
alsorank_bridge = { path = "tests/alsorank_bridge" }
graph_bridge = { path = "tests/graph_bridge" }
trybuild = "1.0"
# `analysis::analyze_module` takes a `syn::ItemMod`, so any caller needs `syn` anyway; the
# reachability test in `tests/analysis_api.rs` is written the way a user would write it.
syn = { version = "2.0", features = ["full", "parsing", "printing"] }

[workspace]
members = [
  "decycle-impl",
  "macro",
  "tests/traitdef",
  "tests/typedef",
  "tests/alsorank_bridge",
]
resolver = "2"
