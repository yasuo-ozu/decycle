[package]
name = "decycle"
version = "0.5.3"
edition = "2021"
rust-version = "1.71"
description = "Solve circular trait obligation"
license = "MIT"
repository = "https://github.com/yasuo-ozu/decycle"
keywords = ["macro", "trait", "recursive", "circular", "obligation"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
# Without this the published tarball is ~815 KB, of which ~729 KB is the logo — which is never read
# at build time, since the crate docs link it by URL. The test suite and CI config are likewise not
# something a consumer compiles. (`tests/*` holds path dev-dependencies; cargo strips path-only
# dev-deps from the published manifest, so leaving their sources out is fine.)
exclude = ["decycle.png", "tests/", ".github/"]

[lib]
path = "lib.rs"

[dependencies]
decycle-macro = { path = "macro", version = "0.5.3" }
decycle-impl = { path = "decycle-impl", version = "0.5.3", optional = true }

[features]
default = ["std", "api"]
# The unbounded re-entry registry is a `thread_local!` map. Without it the ranked engine still
# runs at a fixed depth (`support_infinite_cycle = false`), and the structural engine is
# unaffected — it emits no runtime machinery at all.
std = []
# The programmatic surface: both engines' entry points, the obligation-graph API, and safegraph.
# Off, `decycle-impl` is not compiled for your target at all, which is what makes `no_std` work.
api = ["dep:decycle-impl"]

[dev-dependencies]
traitdef = { path = "tests/traitdef" }
typedef = { path = "tests/typedef" }
alsorank_bridge = { path = "tests/alsorank_bridge" }
graph_bridge = { path = "tests/graph_bridge" }
# Counts its own expansions, so a test can pin that a method attribute macro runs exactly once.
attrcount = { path = "tests/attrcount" }
trybuild = "1.0"
[dev-dependencies.syn]
version = "2.0"
# `analysis::analyze_module` takes a `syn::ItemMod`, so the reachability test builds one; that is
# all the suite needs from syn.
default-features = false
features = ["clone-impls", "full", "parsing", "printing"]

[workspace]
members = [
  "decycle-impl",
  "macro",
  "tests/traitdef",
  "tests/typedef",
  "tests/alsorank_bridge",
  "tests/graph_bridge",
  "tests/attrcount",
]
# Built explicitly by the `no_std` CI job, never as part of this workspace: cargo unifies features
# across members, so as a member it would receive the very default features it exists to build
# without.
exclude = ["tests/nostd_consumer"]
resolver = "2"
