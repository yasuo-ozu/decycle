[package]
name = "decycle-impl"
version = "0.5.0"
edition = "2021"
rust-version = "1.71"
description = "Internal implementation for decycle macros"
license = "MIT"
repository = "https://github.com/yasuo-ozu/decycle"
keywords = ["macro", "trait", "recursive", "circular", "obligation"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["yasuo-ozu"]

[lib]
path = "src/lib.rs"

[dependencies]
proc-macro2 = "1.0"
proc-macro-error = { version = "1.0", default-features = false }
# type-leak 0.7 (safegraph-backed, MSRV 1.56) replaces 0.6 (gotgraph-backed, empirical
# MSRV 1.87) — well below the 1.71 `syn` floor, so it is a non-optional dependency.
type-leak = "0.7.0"
# Re-exported as `decycle_impl::safegraph`: `analysis::analyze_module` returns a `VecGraph`, so
# callers must be able to name the type without depending on it themselves.
safegraph = { version = "0.2.0", default-features = false }
template-quote = "0.4.0"
# Used only by the `structural` unroll (the ranked engine uses `template-quote`).
quote = "1.0"

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit", "visit-mut"]
