[package]
name = "decycle-impl"
version = "0.5.1"
edition = "2021"
rust-version = "1.71"
description = "Internal implementation for decycle macros"
license = "MIT"
repository = "https://github.com/yasuo-ozu/decycle"
keywords = ["macro", "trait", "recursive", "circular", "obligation"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["yasuo-ozu"]

[lib]
path = "src/lib.rs"

[dependencies]
proc-macro2 = "1.0"
proc-macro-error = { version = "1.0", default-features = false }
type-leak = "0.7.0"
safegraph = { version = "0.2.0", default-features = false }
template-quote = "0.4.0"

[dependencies.syn]
version = "2.0"
# Only what the two engines actually use. `default-features = false` matters: syn's defaults
# include `derive`, which nothing here needs (no `DeriveInput`/`Data`), so leaving them on would
# keep building it. `extra-traits` (Debug/Eq/Hash on AST nodes) is likewise unused.
default-features = false
features = ["clone-impls", "full", "parsing", "printing", "visit", "visit-mut"]
