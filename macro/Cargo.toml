[package]
name = "decycle-macro"
version = "0.5.3"
edition = "2021"
rust-version = "1.71"
description = "Solve circular trait obligation"
license = "MIT"
repository = "https://github.com/yasuo-ozu/decycle"
keywords = ["macro", "trait", "recursive", "circular", "obligation"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["Yasuo Ozu <yasuo@ozu.email>"]

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
decycle-impl = { path = "../decycle-impl", version = "0.5.3" }
proc-macro2 = "1.0"
proc-macro-error = { version = "1.0", default-features = false }
template-quote = "0.4.0"
type-leak = "0.7.0"

[dependencies.syn]
version = "2.0"
# This crate only parses the attribute arguments and the annotated item and re-emits them; it
# walks nothing, so no `visit`/`visit-mut`, and defines no derive, so no `derive`.
default-features = false
features = ["clone-impls", "full", "parsing", "printing", "proc-macro"]

[dev-dependencies]
trybuild = "1.0"
