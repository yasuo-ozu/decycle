[package]
name = "attrcount"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"

[dependencies.syn]
version = "2.0"
default-features = false
features = ["clone-impls", "full", "parsing", "printing", "proc-macro"]
