[package]
name = "graph_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
decycle-impl = { path = "../../decycle-impl" }
proc-macro2 = "1.0"
quote = "1.0"
# `#[proc_macro_error]` expands to paths rooted at a crate literally named `proc_macro_error`.
proc-macro-error = { version = "1.0", default-features = false }

[dependencies.syn]
version = "2.0"
default-features = false
features = ["clone-impls", "full", "parsing", "printing", "proc-macro"]
